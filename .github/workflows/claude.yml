name: Claude Code

# Runs on the self-hosted VPS runner (labels: self-hosted, vps).
# Only the repository owner can trigger it: this repo is public, and the
# runner is a real machine, so nobody else may start jobs on it.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: [self-hosted, vps]
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # The action's own installer downloads from downloads.claude.ai, which
      # answers this VPS with 403 "not available in your location". The npm
      # registry works, so install there, one copy per runner (tool cache).
      - name: Install Claude Code via npm
        id: claude_code
        run: |
          npm install -g --prefix "$RUNNER_TOOL_CACHE/claude-code" --no-fund --no-audit @anthropic-ai/claude-code@latest
          "$RUNNER_TOOL_CACHE/claude-code/bin/claude" --version
          echo "bin=$RUNNER_TOOL_CACHE/claude-code/bin/claude" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ steps.claude_code.outputs.bin }}
