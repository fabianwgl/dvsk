name: Homebrew

# Updates the cask in fabianwgl/homebrew-tap whenever a release is published.
# Needs the HOMEBREW_TAP_TOKEN secret: a fine-grained token with Contents
# read/write access to fabianwgl/homebrew-tap only.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to the tap (e.g. v0.1.0)
        required: true

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checksum the release DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          gh release download "$TAG" --pattern "Dvsk-$VERSION.dmg"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum "Dvsk-$VERSION.dmg" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: fabianwgl/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit the updated cask
        run: |
          mkdir -p tap/Casks
          scripts/render-cask.sh "$VERSION" "$SHA256" > tap/Casks/dvsk.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/dvsk.rb
          git diff --cached --quiet && { echo "Cask already up to date."; exit 0; }
          git commit -m "dvsk $VERSION"
          git push
